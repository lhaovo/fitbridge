# FitBridge —— 纯自托管单体（决策 D3/D6）
#
# 架构：单进程 + SQLite + 本地文件，无外部依赖服务。
#   整个 FitBridge 的状态 = 一个数据目录（默认 ./data）
#
#   docker compose up -d
#
# 不想用 Docker 的话，直接本地跑更简单：
#   npm run build && npm start

services:
  fitbridge:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      FITBRIDGE_DATA_DIR: /data
      FITBRIDGE_HOST: 0.0.0.0
      FITBRIDGE_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      # 数据目录：SQLite + blobs + master.key
      - ./data:/data
